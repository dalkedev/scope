name: Prepare review or draft release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Open a review proposal, or build an existing tag into a draft
        type: choice
        options: [draft, proposal]
        default: draft
        required: true
      tag:
        description: Existing version tag to build
        required: true
        default: v1.3.0
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.mode }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  proposal:
    name: Open maintainer review
    if: inputs.mode == 'proposal'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PROPOSAL_BRANCH: ${{ github.ref_name }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open draft pull request as the Actions bot
        shell: bash
        run: |
          node -e "if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) process.exit(1)"
          version=${RELEASE_TAG#v}
          test "$PROPOSAL_BRANCH" = "release/$version" || { echo 'Proposal branch must match the requested version'; exit 1; }
          review_file="docs/releases/$version-review.md"
          test -f "$review_file" || { echo 'Missing committed release review'; exit 1; }
          existing=$(gh pr list --head "$PROPOSAL_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if test -n "$existing"; then
            echo "Review proposal already exists: #$existing"
          else
            gh pr create --draft --base main --head "$PROPOSAL_BRANCH" --title "Scope $version: maintainer release review" --body-file "$review_file"
          fi
  build:
    if: inputs.mode != 'proposal'
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate release tag
        run: node -e "if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) process.exit(1)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - name: Verify GLib backport integrity and locked selection
        run: python scripts/verify-glib-backport.py --check-selection
      - name: Test GLib integrity enforcement
        run: python -m unittest discover -s scripts/tests
      - name: Test license source attribution
        run: node --test scripts/licenses.test.mjs
      - name: Optimized GLib iterator regression
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p scope-glib-variant-regression
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm test -- --run
      - run: node --test scripts/release.test.mjs
      - run: python -m unittest discover -s resources/device/tests
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Exercise real desktop engine and stdio MCP
        run: node scripts/smoke.mjs
        env:
          SCOPE_BIN: target/release/scope${{ runner.os == 'Windows' && '.exe' || '' }}
          SCOPE_MCP_BIN: target/release/scope-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Stage release assets
        shell: bash
        run: node scripts/release-assets.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: .runtime/release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Refuse to modify an already published release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > existing-state.txt 2>/dev/null; then
            test "$(cat existing-state.txt)" = true || { echo 'Release is already public; review CI artifacts manually.'; exit 1; }
          else
            printf '%s\n' 'Review candidate. Frida is installed separately with the shipped setup helper. Platform builds require runtime review before publication. See docs/RELEASING.md, docs/VERIFICATION.md and docs/DEPENDENCIES.md.' > release-notes.txt
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Scope $RELEASE_TAG" --notes-file release-notes.txt
          fi
      - name: Combine checksums and upload draft assets
        shell: bash
        run: |
          cd release-assets
          cat *-SHA256SUMS.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./* --clobber
