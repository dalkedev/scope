name: Build and check
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Check ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; explicit compiler below
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - name: Verify GLib backport integrity and locked selection
        run: python scripts/verify-glib-backport.py --check-selection
      - name: Test GLib integrity enforcement
        run: python -m unittest discover -s scripts/tests
      - name: Test license source attribution
        run: node --test scripts/licenses.test.mjs
      - name: Optimized GLib iterator regression
        if: runner.os == 'Linux'
        run: cargo test --locked --release -p scope-glib-variant-regression
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm test -- --run
      - run: node --test resources/frida/tests/scope-engine.test.cjs
      - run: node --test scripts/release.test.mjs
      - run: python -m unittest discover -s resources/device/tests
      - name: Test owned Android fixture host controls
        if: runner.os == 'Linux'
        run: python -m unittest discover -s examples/android-engine-fixture/tests
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Exercise real desktop engine and stdio MCP
        run: node scripts/smoke.mjs
        env:
          SCOPE_BIN: target/release/scope${{ runner.os == 'Windows' && '.exe' || '' }}
          SCOPE_MCP_BIN: target/release/scope-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify public resources
        run: node scripts/public-resources.mjs .runtime/public-resources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scope-check-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/
            target/release/scope-mcp*
          if-no-files-found: error
          retention-days: 14
