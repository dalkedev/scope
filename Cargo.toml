[workspace]
members = ["crates/scope-core", "crates/scope-mcp", "crates/scope-device", "crates/glib-variant-regression", "src-tauri"]
exclude = ["vendor/glib"]
resolver = "2"

[patch.crates-io]
glib = { path = "vendor/glib" }

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
