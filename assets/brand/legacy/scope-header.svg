<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Scope — HTTP, in plain sight.</title>
  <desc id="desc">A captured products request passes through a mock rule and becomes a recorded 503 JSON response.</desc>
  <rect width="1200" height="340" rx="16" fill="#17212C"/>
  <path d="M654 40V300" stroke="#334452"/>
  <g stroke="#2F4150"><path d="M36 28h20M46 18v20M1154 302h20M1164 292v20M36 302h20M46 292v20M1154 28h20M1164 18v20"/></g>
  <g transform="translate(63 59)">
    <circle cx="23" cy="23" r="21" stroke="#F2F6FA" stroke-width="4"/>
    <path d="m39 40 15 15" stroke="#F2F6FA" stroke-width="5" stroke-linecap="round"/>
    <path d="M8 24h9l5-11 8 22 5-11h8" stroke="#55D8C6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="133" y="107" fill="#F2F6FA" font-size="67" font-weight="700" letter-spacing="-3">scope</text>
    <text x="63" y="182" fill="#F2F6FA" font-size="43" font-weight="700" letter-spacing="-1.5">HTTP, in plain sight.</text>
    <text x="65" y="221" fill="#ACBDCA" font-size="21">Capture. Rewrite. Keep the evidence.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2">
    <rect x="64" y="263" width="117" height="30" rx="5" fill="#253644"/>
    <circle cx="80" cy="278" r="3" fill="#55D8C6"/>
    <text x="91" y="282" fill="#DCE8F0">LOCAL FIRST</text>
    <text x="205" y="282" fill="#ACBDCA">OPEN SOURCE · AGPL-3.0</text>
  </g>
  <path d="M707 91v149" stroke="#41617A" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <circle cx="707" cy="91" r="5" fill="#55D8C6"/>
    <circle cx="707" cy="160" r="5" fill="#5B8AF5"/>
    <circle cx="707" cy="240" r="5" fill="#EF9B9E"/>
    <text x="731" y="68" fill="#ACBDCA" font-size="11" letter-spacing="1.6">01 / CAPTURE</text>
    <text x="731" y="99" fill="#F2F6FA" font-size="21">GET /api/products</text>
    <text x="731" y="137" fill="#ACBDCA" font-size="11" letter-spacing="1.6">02 / APPLY YOUR RULE</text>
    <rect x="729" y="149" width="385" height="35" rx="5" fill="#263C61"/>
    <text x="743" y="172" fill="#CFDEFF" font-size="15">mock · Product maintenance</text>
    <text x="731" y="215" fill="#ACBDCA" font-size="11" letter-spacing="1.6">03 / RECORD THE RESULT</text>
    <text x="731" y="251" fill="#EF9B9E" font-size="30" font-weight="700">503</text>
    <text x="800" y="248" fill="#E3EBF1" font-size="15">application/json</text>
    <text x="731" y="278" fill="#ACBDCA" font-size="14">{"maintenance": true}</text>
    <text x="731" y="311" fill="#7F97A9" font-size="11">RUST ENGINE / TAURI DESKTOP / MCP</text>
  </g>
</svg>
